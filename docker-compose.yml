version: '3.8'

services:
  mork-server:
    image: trueagi/mork:server-latest
    container_name: mork-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MORK_HOST=0.0.0.0
      - MORK_PORT=8080
      - RUST_LOG=info
    volumes:
      - ./data/mork_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
